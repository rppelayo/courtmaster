<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reserve a Court - CourtMaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --page-bg: #f4f8f3;
      --page-accent: #dcefe7;
      --surface: #ffffff;
      --surface-soft: #edf6f1;
      --border: #cfe0d8;
      --text: #173630;
      --muted: #607a72;
      --primary: #0f766e;
      --primary-strong: #0b5f58;
      --available: #0f766e;
      --available-hover: #0b5f58;
      --selected: #2a9d8f;
      --reserved: #d7ddd9;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
        linear-gradient(180deg, #fbfdf9 0%, var(--page-bg) 100%);
      color: var(--text);
    }

    .page-shell {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(207, 224, 216, 0.9);
      box-shadow: 0 30px 80px rgba(23, 54, 48, 0.12);
      backdrop-filter: blur(10px);
    }

    .page-title {
      color: var(--primary);
    }

    .page-copy {
      color: var(--muted);
    }

    .court-card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(23, 54, 48, 0.05);
    }

    .court-card:hover {
      border-color: rgba(15, 118, 110, 0.5);
      background: #f7fcfa;
    }

    .court-card-selected {
      background: linear-gradient(180deg, #f5fffc 0%, #e3f5ef 100%);
      border: 1px solid rgba(15, 118, 110, 0.8);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18);
    }

    .schedule-card {
      background: var(--surface);
      border: 1px solid rgba(207, 224, 216, 0.9);
      box-shadow: 0 15px 40px rgba(23, 54, 48, 0.08);
    }

    .date-input {
      border: 1px solid var(--border);
      background: #fcfefd;
      color: var(--text);
    }

    .primary-button {
      background: var(--primary);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--primary-strong);
    }

    .slot-available {
      background: var(--available);
      color: #ffffff;
    }

    .slot-available:hover {
      background: var(--available-hover);
    }

    .slot-selected {
      background: var(--selected);
      color: #ffffff;
    }

    .slot-selected:hover {
      background: #238579;
    }

    .slot-reserved {
      background: var(--reserved);
      color: #66746e;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 mx-5">

  <div class="page-shell max-w-4xl mx-auto p-6 mt-8 rounded-[28px]">
    <h1 class="page-title text-2xl font-bold mb-2 text-center">Reserve a Court</h1>
    <p class="page-copy text-center mb-6">Pickleball reservations</p>

    <div id="court-selection" class="hidden">
      <h2 class="text-lg text-slate-800 font-semibold mb-2">Select a Court</h2>
      <p class="text-sm text-slate-500 mb-4">Choose one of the available pickleball courts in the facility.</p>
      <div id="court-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Courts are inserted here -->
      </div>
    </div>

    <div id="schedule-view" class="schedule-card hidden mt-8 p-4 rounded-[22px] text-sm overflow-x-auto">
      <div class="mb-4 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div class="flex flex-wrap items-center gap-4">
          <div>
            <span class="inline-block w-4 h-4 rounded-sm mr-2 align-middle" style="background: var(--available);"></span>
            <span class="align-middle">Available</span>
          </div>
          <div>
            <span class="inline-block w-4 h-4 rounded-sm mr-2 align-middle" style="background: var(--selected);"></span>
            <span class="align-middle">Selected</span>
          </div>
          <div>
            <span class="inline-block w-4 h-4 rounded-sm mr-2 align-middle" style="background: var(--reserved);"></span>
            <span class="align-middle">Reserved</span>
          </div>
        </div>
        <div class="w-full lg:w-auto">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-end">
            <label for="reservation-date" class="text-sm font-semibold text-slate-700">Select a Date</label>
            <input id="reservation-date" type="date" class="date-input w-full rounded-xl px-3 py-2 sm:w-[240px]">
          </div>
        </div>
      </div>
      <div id="time-table"></div>
    </div>
  </div>

  <script>
    const selectedSport = "Pickleball";
    const selectedSportType = "pickleball";
    let selectedCourt = "";
    let selectedCourtId = "";
    let selectedCourtFee = 0;
    let selectedCourtOpen = "08:00:00";
    let selectedCourtClose = "22:00:00";
    let selectedTimeSlots = new Set();
    let selectedCourtButton = null;

    document.addEventListener("DOMContentLoaded", function () {
      const dateInput = document.getElementById("reservation-date");
      const today = new Date().toISOString().split("T")[0];

      dateInput.min = today;
      dateInput.value = today;
      dateInput.addEventListener("change", async function () {
        selectedTimeSlots = new Set();

        if (!this.value || !selectedCourt) {
          document.getElementById("schedule-view").classList.add("hidden");
          return;
        }

        await renderSchedule(this.value);
      });

      document.getElementById("court-selection").classList.remove("hidden");
      loadPickleballCourts();
    });

    async function loadPickleballCourts() {
      const courtList = document.getElementById("court-list");
      const scheduleContainer = document.getElementById("schedule-view");

      scheduleContainer.classList.add("hidden");
      courtList.innerHTML = "<p class='text-slate-500 text-center sm:col-span-2 lg:col-span-3'>Loading pickleball courts...</p>";

      try {
        const res = await fetch(`api/get_courts.php?sport=${encodeURIComponent(selectedSportType)}`);
        const courts = await res.json();

        courtList.innerHTML = "";

        if (!Array.isArray(courts) || courts.length === 0) {
          courtList.innerHTML = "<p class='text-slate-500 text-center sm:col-span-2 lg:col-span-3'>No pickleball courts are available yet.</p>";
          return;
        }

        courts.forEach((court) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = getCourtCardClassName(false);
          card.innerHTML = `
            <div class="text-lg font-semibold text-slate-900">${court.name}</div>
            <div class="mt-2 text-sm text-slate-600">Hours: ${formatTo12Hour(court.open_time || "08:00:00")} - ${formatTo12Hour(court.close_time || "22:00:00")}</div>
            <div class="mt-1 text-sm font-semibold text-teal-700">Rate: P${parseFloat(court.price || 0).toFixed(2)} per hour</div>
          `;

          card.onclick = () => {
            selectCourt(court, card);
          };

          courtList.appendChild(card);
        });
      } catch (error) {
        courtList.innerHTML = "<p class='text-red-600 text-center sm:col-span-2 lg:col-span-3'>Failed to load pickleball courts.</p>";
        console.error(error);
      }
    }

    async function renderSchedule(date) {
      if (!selectedCourt) {
        return;
      }

      const reservedTimes = await fetchReservedTimes(date, selectedCourt);
      const scheduleView = document.getElementById("schedule-view");
      const timeTable = document.getElementById("time-table");
      const hours = buildHourSlots(selectedCourtOpen, selectedCourtClose);

      scheduleView.classList.remove("hidden");
      timeTable.innerHTML = "";

      const table = document.createElement("table");
      table.className = "min-w-full table-fixed border border-[color:var(--border)] text-sm";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      const timeHeader = document.createElement("th");
      timeHeader.textContent = "Time";
      timeHeader.className = "border px-3 py-2 text-left font-semibold text-slate-700";
      timeHeader.style.background = "#eef5f1";
      headerRow.appendChild(timeHeader);

      const dayHeader = document.createElement("th");
      dayHeader.textContent = formatDisplayDate(date);
      dayHeader.className = "border px-3 py-2 text-center font-semibold text-slate-700";
      dayHeader.style.background = "#eef5f1";
      headerRow.appendChild(dayHeader);

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      hours.forEach((time) => {
        const row = document.createElement("tr");

        const timeCell = document.createElement("td");
        timeCell.textContent = `${formatTo12Hour(time)} - ${formatTo12Hour(addOneHour(time))}`;
        timeCell.className = "border px-3 py-3 font-medium text-slate-700";
        row.appendChild(timeCell);

        const slotCell = document.createElement("td");
        const isReserved = reservedTimes.some((reserved) => reserved.time === time);

        slotCell.className = `border px-3 py-3 text-center font-semibold transition ${
          isReserved
            ? "slot-reserved"
            : "slot-available cursor-pointer"
        }`;
        slotCell.textContent = isReserved ? "Reserved" : "Available";

        if (!isReserved) {
          slotCell.onclick = () => toggleTimeSlot(slotCell, time);
        }

        row.appendChild(slotCell);
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      timeTable.appendChild(table);

      const proceedWrapper = document.createElement("div");
      proceedWrapper.className = "mt-4 flex justify-center";

      const proceedBtn = document.createElement("button");
      proceedBtn.type = "button";
      proceedBtn.textContent = "Proceed to Reservation";
      proceedBtn.className = "primary-button px-4 py-2 rounded-xl";
      proceedBtn.onclick = () => {
        if (selectedTimeSlots.size === 0) {
          alert("Please select at least one time slot.");
          return;
        }

        const feePerSlot = parseFloat(selectedCourtFee || 0);
        const selectedSlots = Array.from(selectedTimeSlots).sort();
        const totalFee = feePerSlot * selectedSlots.length;
        const url = `complete_reservation.php?sport=${encodeURIComponent(selectedSport)}&court=${encodeURIComponent(selectedCourt)}&court_id=${encodeURIComponent(selectedCourtId)}&section=0&date=${encodeURIComponent(date)}&time=${encodeURIComponent(selectedSlots.join(","))}&fee=${encodeURIComponent(totalFee)}`;
        window.location.href = url;
      };

      proceedWrapper.appendChild(proceedBtn);
      timeTable.appendChild(proceedWrapper);
    }

    function toggleTimeSlot(cell, time) {
      if (selectedTimeSlots.has(time)) {
        selectedTimeSlots.delete(time);
        cell.className = "border px-3 py-3 text-center font-semibold transition slot-available cursor-pointer";
        cell.textContent = "Available";
        return;
      }

      selectedTimeSlots.add(time);
      cell.className = "border px-3 py-3 text-center font-semibold transition slot-selected cursor-pointer";
      cell.textContent = "Selected";
    }

    function buildHourSlots(openTime, closeTime) {
      const slots = [];
      const startHour = parseInt(openTime.split(":")[0], 10);
      const endHour = parseInt(closeTime.split(":")[0], 10);

      for (let hour = startHour; hour < endHour; hour++) {
        slots.push(`${hour.toString().padStart(2, "0")}:00:00`);
      }

      return slots;
    }

    function addOneHour(timeStr) {
      const [hour, minute] = timeStr.split(":").map(Number);
      let nextHour = hour + 1;
      if (nextHour >= 24) {
        nextHour -= 24;
      }

      return `${nextHour.toString().padStart(2, "0")}:${minute.toString().padStart(2, "0")}:00`;
    }

    function formatTo12Hour(timeStr) {
      const [hour, minute] = timeStr.split(":");
      const numericHour = parseInt(hour, 10);
      const ampm = numericHour >= 12 ? "PM" : "AM";
      const hour12 = numericHour % 12 === 0 ? 12 : numericHour % 12;
      return `${hour12}:${minute} ${ampm}`;
    }

    function formatDisplayDate(dateStr) {
      const date = new Date(`${dateStr}T00:00:00`);
      return date.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function getCourtCardClassName(isSelected) {
      return isSelected
        ? "court-card-selected rounded-2xl p-5 text-left transition"
        : "court-card rounded-2xl p-5 text-left transition";
    }

    async function selectCourt(court, card) {
      if (!court) {
        return;
      }

      if (selectedCourtButton) {
        selectedCourtButton.className = getCourtCardClassName(false);
      }

      selectedCourtButton = card;
      selectedCourtButton.className = getCourtCardClassName(true);

      selectedCourt = court.name;
      selectedCourtId = court.id;
      selectedCourtOpen = court.open_time || "08:00:00";
      selectedCourtClose = court.close_time || "22:00:00";
      selectedCourtFee = court.price || 0;
      selectedTimeSlots = new Set();

      const dateInput = document.getElementById("reservation-date");
      dateInput.value = new Date().toISOString().split("T")[0];
      document.getElementById("schedule-view").classList.remove("hidden");
      document.getElementById("schedule-view").scrollIntoView({ behavior: "smooth" });
      dateInput.dispatchEvent(new Event("change"));
    }

    async function fetchReservedTimes(date, court) {
      const res = await fetch("api/get_reserved_times.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date, court })
      });
      return res.json();
    }
  </script>
</body>
</html>
